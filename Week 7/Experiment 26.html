<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: flex;
}
.box {
  width: 50%;
  padding: 20px;
  background: lightblue;
  border: 1px solid white;
}
@media (max-width: 600px) {
  .container {
    flex-direction: column;
  }
  .box {
    width: auto;
  }
}
</style>
</head>
<body>
  <h2>Responsive Layout</h2>
  <div class="container">
    <div class="box">Section 1</div>
    <div class="box">Section 2</div>
  </div>
</body>
</html>
