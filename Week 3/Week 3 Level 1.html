<!DOCTYPE html>
<html>
<head>
<title>Forms</title>
</head>
<body>
<form>
<label for ="s1">Name:</label>
<input type="text" id="s1" name="name">
<label for ="s2">Password:</label>
<input type="password" id="s2" name="password">
<label for ="s3">Email:</label>
<input type="Email" id="s3" name="email">
<label>Gender:</label>
<label for ="m">Male</label>
<input type="radio" id="m" name="gender" value="male">
<label for ="f">Female</label>
<input type="radio" id="f" name="gender" value="female">
<label>Skills:</label>
<label for ="s4">HTML</label>
<input type="checkbox" id="s4" name="skills" value="html">
<label for ="s5">CSS</label>
<input type="checkbox" id="s5" name="skills" value="css">
<label for ="s6">JavaScript</label>
<input type="checkbox" id="s6" name="skills" value="js">
<label for="Dept">Department:</label>
<select id="Dept" name="department">
<option value="CSE">CSE</option>
<option value="ECE">ECE</option>
<option value="EEE">EEE</option>
</select>
<label for="a1">Address</label>
<textarea id="a1" name="address" rows="5" cols="15"></textarea>
<button type="Submit">Submit</button>
<button type="Reset">Reset</button>
</form>
</body>
</html>
