<!DOCTYPE html>
<html>
<head>
<title>Registration</title>
</head>
<body>
<h1>Registration Form:</h1>
<p>Fill out the form carefully for registration. All fields are mandatory.</p>
<form>
<table>
<tr>
<td><label for="s1">Student Name: </label></td>
<td><input type="text" id="s1" name="name" required></td>
<tr>
<tr>
<td><label for="s2">Date of Birth:</label></td>
<td><input type="date" id="s2" name="dob" required></td>
</tr>
<tr>
<td><label>Gender:</label></td>
<td>
<label for="m">Male</label>
<input type="radio" id="m" name="gender" value="male" required>
<label for="f">Female</label>
<input type="radio" id="f" name="gender" value="female" required>
</td>
</tr>
<tr>
<td><label for="a1">Address: </label></td>
<td><textarea id="a1" name="address" rows="5" cols="25" required></textarea></td>
</tr>
<tr>
<td><label for="s3">Email: </label></td>
<td><input type="email" id="s3" name="email" required></td>
</tr>
<tr>
<td><label for="s4">Phone Number: </label></td>
<td><input type="tel" id="s4" name="phone" required></td>
</tr>
<tr>
<td
<button type="submit">Submit</button>
<button type="reset">Reset</button>
</td>
</tr>
</table>
</form>
</body>
</html>
