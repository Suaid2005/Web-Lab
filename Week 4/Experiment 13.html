<!DOCTYPE html>
<html>
<head>
<title>Inline and Internal CSS</title>
<style>
h1 {
color: blue;
text-align: center;
}
p {
font-size: 18px;
color: green;
}
</style>
</head>
<body>
<h1>CSS Styling Example</h1>
<p style="color: red; font-weight: bold;">
This paragraph uses inline CSS.
</p>
<p>
This paragraph uses internal CSS.
</p>
</body>
</html>
