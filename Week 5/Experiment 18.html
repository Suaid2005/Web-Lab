<!DOCTYPE html>
<html>
<head>
<title>Styled Webpage</title>
<style>
    body {
        font-family: Times New Roman;
        background-color: black;
    }
    h1 {
        color: yellow;
        text-align: center;
        font-size: 32px;
    }
    h2 {
        color: red;
        text-decoration: underline;
    }
    p {
        font-size: 18px;
        line-height: 1.5;
        color: white;
    }
    .c1 {
        font-weight: bold;
    }
    .c2 {
        font-style: italic;
    }
    .c3 {
        text-align: center;
    }
</style>
</head>
<body>
<h1>My Web Technology Page</h1>
<h2>Introduction</h2>
<p>
Web technology is used to create and design websites.
HTML provides the structure of a webpage while CSS is used
to style the webpage.
</p>
<p class="c1">
HTML stands for HyperText Markup Language.
</p>
<p class="c2">
CSS stands for Cascading Style Sheets.
</p>
<p class="c3">
This paragraph is aligned in the center.
</p>
</body>
</html>
