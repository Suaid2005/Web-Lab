<!DOCTYPE html>
<html>
<head>
<title>Font Properties</title>
<style>
    .c1 {
        font-family: Times New Roman;
        font-size: 30px;
        font-style: bold;
    }
    .c2 {
        font-family: Georgia;
        font-size: 20px;
        font-style: italic;
    }
    .c3 {
        font-family: Arial;
        font-size: 18px;
        font-style: italic;
    }
</style>
</head>
<body>
<h1 class="c1"><u>Font Properties:</u></h1>
<p class="c2">
This paragraph uses Georgia font with 20px size and italic style.
</p>
<p class="c3">
This text uses Arial font with 18px size and italic style.
</p>
</body>
</html>
