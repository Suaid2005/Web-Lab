<!DOCTYPE html>
<html>
<head>
<title>Box Model Layout</title>
<style>
    .c1 {
        background-color: yellow;
        color: black;
        text-align: center;
        padding: 15px;
        margin: 10px;
        border: 2px solid black;
    }
    .c2 {
        display: flex;
        margin: 10px;
    }
    .c3 {
        width: 60%;
        padding: 20px;
        border: 2px solid green;
        margin-right: 10px;
    }
    .c4 {
        width: 40%;
        padding: 20px;
        border: 2px solid green;
    }
    .c5 {
        background-color: black;
        color: white;
        text-align: center;
        padding: 10px;
        margin: 10px;
        border: 2px solid black;
    }
</style>
</head>
<body>
<div class="c1">
<h1>My Webpage</h1>
</div>
<div class="c2">
<div class="c3">
<h2><u>Content</u></h2>
<p>This is the main content.</p>
</div>
<div class="c4">
<h2><u>Sidebar</u></h2>
<p>HTML</p>
<p>CSS</p>
</div>
</div>
<div class="c5">
Web Technology Lab
</div>
</body>
</html>
