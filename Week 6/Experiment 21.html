<!DOCTYPE html>
<html>
<head>
<style>
.box1 {
  position: static;
  background: lightblue;
  padding: 10px;
}
.box2 {
  position: relative;
  left: 30px;
  background: lightgreen;
  padding: 10px;
}
</style>
</head>
<body>
  <div class="box1">Static Box</div>
  <div class="box2">Relative Box</div>
</body>
</html>
