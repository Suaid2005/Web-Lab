<!DOCTYPE html>
<html>
<head>
<style>
.container {
  position: relative;
  height: 200px;
  background: lightyellow;
}
.box1 {
  position: absolute;
  top: 20px;
  right: 20px;
  background: coral;
  padding: 10px;
}
.box2 {
  position: fixed;
  bottom: 10px;
  right: 10px;
  background: lightblue;
  padding: 10px;
}
</style>
</head>
<body>
  <div class="container">
    Container
    <div class="box1">Absolute</div>
  </div>
  <div class="box2">Fixed</div>
</body>
</html>
