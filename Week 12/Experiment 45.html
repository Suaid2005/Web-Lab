<!DOCTYPE html>
<html>
<head>
<title>JavaScript Objects</title>
</head>
<body>
<h2>Student Object</h2>
<p id="output"></p>
<script>
let student = {
name: "Rahul",
age: 20,
department: "CSE",
college: "ABC College"
};
document.getElementById("output").innerHTML =
"Name: " + student.name + "<br>" +
"Age: " + student.age + "<br>" +
"Department: " + student.department + "<br>" +
"College: " + student.college;
</script>
</body>
</html>
